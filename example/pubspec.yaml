name: universal_can_example
description: "Demonstrates how to use the universal_can plugin."
publish_to: 'none'

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  universal_can:
    path: ../

  flutter_bluetooth_serial_ble: ^0.5.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
